<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="Unit Converter" content="width=device-width, initial-scale=1.0">
        <title>Bloooog</title>
        <link rel="stylesheet" href="static/styles.css">
    </head>
    <body>
        <h1>Personal Blog</h1>
        <main class="container">
            <section class="articles">
                {{range .}}
                    <article class="article">
                        <h2>{{.Title}}</h2>
                        <span class="pubdate">{{.PubDate}}</span>
                    </article>
                {{end}}
            </section>
        </main>
    </body>
</html>
